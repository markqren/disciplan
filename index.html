// ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
// TABS
// ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●

const TABS=[["entry","+ new entry"],["income","income statement"],["balance","balance sheet"],["portfolio","portfolio"],["tags","tags"],["ledger","ledger"],["cashback","cashback"],["onboarding","onboarding"],["export","export"]];
const MOB_NAV_PRIMARY=[["entry","Entry","+"],["income","Income","$"],["ledger","Ledger","≡"],["tags","Tags","#"]];
const MOB_NAV_MORE=[["balance","Balance sheet"],["portfolio","Portfolio"],["cashback","Cashback"],["onboarding","Onboarding"],["export","Export"],["ai","AI portal"],["settings","Settings"]];

function switchTab(id){
  state.tab=id;
  history.replaceState(null,null,"#"+id);
  renderTabs();
  renderContent();
}

function openMobMoreSheet(){
  const body=h("div",{class:"stack"});
  const hidden=hiddenTabsFor(state.view);
  MOB_NAV_MORE.forEach(([id,label])=>{
    if(hidden.includes(id))return;
    body.append(h("button",{type:"button",class:"btn",style:{width:"100%",background:"rgba(255,255,255,0.04)",color:"rgba(255,255,255,0.75)",marginBottom:"8px"},onClick:()=>{document.querySelector(".sheet-bg,.modal-bg")?.remove();switchTab(id)}},label));
  });
  body.append(h("button",{type:"button",class:"btn",style:{width:"100%",background:"rgba(255,255,255,0.02)",color:"rgba(255,255,255,0.35)"},onClick:()=>{document.querySelector(".sheet-bg,.modal-bg")?.remove();supabaseClient.auth.signOut()}},"Sign out"));
  openSheet({title:"More",body});
}

function renderMobNav(){
  const nav=document.getElementById("mobNav");
  const fab=document.getElementById("fabAdd");
  if(!nav)return;
  nav.innerHTML="";
  if(!isMobile()){
    nav.style.display="none";
    if(fab)fab.style.display="none";
    return;
  }
  nav.style.display="flex";
  if(fab){
    const showFab=["income","ledger","tags"].includes(state.tab);
    fab.style.display=showFab?"block":"none";
  }
  const hidden=hiddenTabsFor(state.view);
  const offline=!navigator.onLine;
  MOB_NAV_PRIMARY.forEach(([id,label,ico])=>{
    if(hidden.includes(id))return;
    const disabled=offline&&(id==="entry");
    nav.append(h("button",{type:"button",class:"mob-nav-btn"+(state.tab===id?" on":""),style:disabled?{opacity:"0.35"}:{},onClick:()=>{if(disabled)return;switchTab(id)}},h("span",{class:"ico"},ico),label));
  });
  if(isWideMobile()&&!hidden.includes("balance")){
    nav.append(h("button",{type:"button",class:"mob-nav-btn"+(state.tab==="balance"?" on":""),onClick:()=>switchTab("balance")},h("span",{class:"ico"},"◫"),"Balance"));
  }
  nav.append(h("button",{type:"button",class:"mob-nav-btn"+(state.tab==="settings"||state.tab==="ai"||MOB_NAV_MORE.some(m=>m[0]===state.tab&&!MOB_NAV_PRIMARY.some(p=>p[0]===state.tab))?" on":""),onClick:openMobMoreSheet},h("span",{class:"ico"},"⋯"),"More"));
}

function renderTabs(){
  const bar=document.getElementById("tabBar");
  bar.innerHTML="";
  const offline=!navigator.onLine;
  const hidden=hiddenTabsFor(state.view);
  TABS.forEach(([id,label])=>{
    if(hidden.includes(id))return;
    const disabled=offline&&(id==="entry"||id==="export");
    const b=h("button",{class:"tab"+(state.tab===id?" on":""),style:disabled?{opacity:"0.3",cursor:"default"}:{},onClick:()=>switchTab(id)},label);
    bar.append(b);
  });
  const so=h("button",{class:"tab",style:{color:"rgba(255,255,255,0.3)",borderColor:"transparent",fontSize:"11px"},onClick:()=>supabaseClient.auth.signOut()},"sign out");
  bar.append(so);
  bar.style.display=isMobile()?"none":"flex";
  renderMobNav();
}

// True when a main tab is hidden for the active view (and shouldn't stay open).
// 'ai' and 'settings' live in the footer, never in TABS, so they're never hidden.
function isTabHidden(id){return TABS.some(t=>t[0]===id)&&hiddenTabsFor(state.view).includes(id)}

// Footer Settings panel: per-view tab visibility. Toggling re-renders the nav.
function renderSettings(el){
  const viewName=(householdMembers.find(m=>m.owner===state.view)||{}).display_name||(state.view==="combined"?"Combined":(currentDisplayName||"your"));
  const card=h("div",{class:"cd"});
  card.innerHTML=`<h3 style="margin-top:0">Settings</h3><p class="sub" style="margin-top:0">Tab visibility for <b style="color:var(--accent)">${viewName}</b>'s view. Unchecked tabs are hidden from the top nav for this view only \u2014 switch the header view to configure another person.</p>`;
  const list=h("div",{style:{display:"flex",flexDirection:"column",gap:"8px",marginTop:"8px",maxWidth:"420px"}});
  TABS.forEach(([id,label])=>{
    const row=h("label",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px",padding:"10px 12px",borderRadius:"8px",background:"rgba(255,255,255,0.02)",cursor:"pointer"}});
    const cb=h("input",{type:"checkbox",style:{accentColor:"var(--accent)",cursor:"pointer",width:"auto",margin:"0"}});
    cb.checked=!hiddenTabsFor(state.view).includes(id);
    cb.addEventListener("change",()=>{
      const set=new Set(hiddenTabsFor(state.view));
      if(cb.checked)set.delete(id);else set.add(id);
      setHiddenTabsFor(state.view,[...set]);
      renderTabs();
    });
    row.append(h("span",{style:{fontSize:"13px",color:"rgba(255,255,255,0.8)",textTransform:"capitalize"}},label),cb);
    list.append(row);
  });
  card.append(list);
  el.append(card);
}

// Mark | Shilpa | Combined household view switcher. Only shown when the
// signed-in user has a household with 2+ members (i.e. after the multi-user
// migration is applied and profiles exist).
function renderViewSwitch(){
  const el=document.getElementById("viewSwitch");
  if(!el)return;
  el.innerHTML="";
  if(!householdMembers||householdMembers.length<2){el.style.display="none";return}
  el.style.display="inline-flex";
  const opts=[...householdMembers.map(m=>[m.owner,m.display_name]),["combined","Combined"]];
  // First entry (no valid persisted view) defaults to Mark. Any explicit pick —
  // Mark, Shilpa, or Combined — is persisted to dc_view and respected on reload.
  if(!opts.some(o=>o[0]===state.view))state.view=opts.some(o=>o[0]==="mark")?"mark":(currentOwner||"combined");
  applyAccent();
  opts.forEach(([val,label])=>{
    const b=h("button",{class:"vw-btn"+(state.view===val?" on":""),onClick:()=>{
      if(state.view===val)return;
      state.view=val;try{localStorage.setItem("dc_view",val)}catch(e){}
      applyAccent();
      dcClearAll();
      // If the tab you're on is hidden for the new view, fall back to Income.
      if(isTabHidden(state.tab)){state.tab="income";history.replaceState(null,null,"#income")}
      renderViewSwitch();
      renderTabs();
      renderContent();
      renderMonthlyChecklist();
    }},label);
    el.append(b);
  });
}

async function renderContent(){
  const ob=document.getElementById("offlineBanner");if(ob)ob.classList.add("hidden");
  document.querySelectorAll(".batch-bar").forEach(b=>b.remove());
  const el=document.getElementById("content");
  if(!el){
    console.error("renderContent: missing #content container");
    return;
  }
  el.innerHTML="";
  if(!navigator.onLine&&(state.tab==="entry"||state.tab==="export")){
    el.innerHTML=`<div class="cd" style="text-align:center;padding:48px 24px"><div style="font-size:32px;margin-bottom:12px">\uD83D\uDCE1</div><h3 style="margin-bottom:8px">Offline Mode</h3><p style="font-size:13px;color:rgba(255,255,255,0.5)">${state.tab==="entry"?"Adding new transactions":"Exporting data"} requires an internet connection.<br>Browse cached data in other tabs while offline.</p></div>`;
    return;
  }
  try{
    if(state.tab==="entry")await renderEntry(el);
    else if(state.tab==="income"&&state.year==="all")await renderCrossYear(el);
    else if(state.tab==="income")await renderIS(el);
    else if(state.tab==="balance")await renderBS(el);
    else if(state.tab==="portfolio")await renderPortfolio(el);
    else if(state.tab==="tags")await renderTags(el);
    else if(state.tab==="ledger")await renderLedger(el);
    else if(state.tab==="cashback")await renderCashback(el);
    else if(state.tab==="onboarding")await renderOnboarding(el);
    else if(state.tab==="export")await renderExport(el);
    else if(state.tab==="ai")await renderAIPortal(el);
    else if(state.tab==="settings")renderSettings(el);
  }catch(e){
    const tabLabel=TABS.find(t=>t[0]===state.tab)?.[1]||state.tab;
    el.innerHTML=`<div class="cd" style="border-color:rgba(224,122,95,0.3);text-align:center;padding:48px 24px"><h3 style="color:var(--r);margin-bottom:8px">Failed to load ${tabLabel}</h3><p style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:20px;font-family:var(--mono)">${e.message||String(e)}</p><button class="pg-btn" onclick="renderContent()" style="padding:8px 20px">Retry</button></div>`;
    console.error("Tab render error ["+state.tab+"]:",e);
  }
}

function statCard(icon,label,value,color){
  const d=h("div",{class:"cd st"});
  d.innerHTML=`<div class="st-l">${icon?icon+" ":""}${label}</div><div class="st-v" style="color:${color}">${value}</div>`;
  return d;
}

// ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
// ENTRY TAB
// ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●



// ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
// INIT
// ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●

async function init(){
  // Restore tab from URL hash
  const validTabs=TABS.map(t=>t[0]);
  const hash=location.hash.slice(1);
  if(hash==="income-all"){state.tab="income";state.year="all"}
  else if(hash==="ai"){state.tab="ai"}
  else if(hash==="settings"){state.tab="settings"}
  else if(validTabs.includes(hash)){state.tab=hash}
  if(!location.hash)history.replaceState(null,null,"#"+state.tab);

  renderViewSwitch();
  // A hidden tab (per the active view) shouldn't open from a stale hash.
  if(isTabHidden(state.tab)){state.tab="income";history.replaceState(null,null,"#income")}
  renderTabs();
  fetchLiveFX();
  try{
    const r=await fetch(`${SB_URL}/rest/v1/transactions?select=id&limit=1`,{headers:authHeaders({Prefer:"count=exact"})});
    if(!r.ok)throw new Error(r.status);
    const count=r.headers.get("content-range")?.split("/")[1];
    state.txnCount=count?parseInt(count):0;
    document.getElementById("dbStatus").textContent=`● ${state.txnCount.toLocaleString()} txns`;
    document.getElementById("dbStatus").style.color="var(--g)";
  }catch(e){
    document.getElementById("dbStatus").textContent="● disconnected";
    document.getElementById("dbStatus").style.color="var(--r)";
  }
  // Check for pending email imports
  try{
    const pr=await fetch(`${SB_URL}/rest/v1/pending_imports?status=eq.pending&select=id&limit=1`,{headers:authHeaders({Prefer:"count=exact"})});
    if(pr.ok){
      const pc=pr.headers.get("content-range")?.split("/")[1];
      state.pendingEmails=pc?parseInt(pc):0;
      if(state.pendingEmails>0){
        const old=document.getElementById("emailImportBanner");
        if(old)old.remove();
        const banner=document.createElement("div");
        banner.id="emailImportBanner";
        banner.style.cssText="background:rgba(74,111,165,0.15);color:var(--b);text-align:center;padding:6px 12px;font-size:11px;border-bottom:1px solid rgba(74,111,165,0.2);cursor:pointer";
        banner.innerHTML=`\u{1F4E7} ${state.pendingEmails} pending email import${state.pendingEmails>1?"s":""} — <b>Review</b>`;
        banner.onclick=()=>{state.tab="entry";renderTabs();renderContent();setTimeout(()=>document.getElementById("emailImportSection")?.scrollIntoView({behavior:"smooth"}),100)};
        document.querySelector(".hdr").after(banner);
      }
    }
  }catch(e){/* silent — non-critical */}
  // Auto-link reimbursements (fire-and-forget, don't block app load)
  scanForReimbursementLinks().catch(e=>console.error("Link scan error:",e));
  // Surface pending cross-person shared transactions for approval
  checkPendingSharedTxns().catch(e=>console.error("Shared txn check error:",e));
  // Refresh button handler
  document.getElementById("refreshBtn").addEventListener("click",function(){
    this.classList.add("spinning");
    this.addEventListener("animationend",()=>this.classList.remove("spinning"),{once:true});
    // Invalidate this tab's cache so refresh always fetches fresh data (FEA-89)
    if(state.tab==="income"&&state.year==="all")dcDel('crossyear');
    else if(state.tab==="income")dcDel('is_'+state.year);
    else if(state.tab==="balance")dcDel('bs');
    else if(state.tab==="portfolio")dcDel('portfolio');
    renderContent();
  });
  // Online/offline reactivity (FEA-23)
  window.addEventListener('online',()=>{document.getElementById("offlineBanner")?.classList.add("hidden");renderTabs();if(state.tab==="entry"||state.tab==="export")renderContent()});
  window.addEventListener('offline',()=>{renderTabs();if(state.tab==="entry"||state.tab==="export")renderContent()});
  renderContent();
  renderMonthlyChecklist();
  setupCollapsingHeader();
  onBreakpointChange(()=>{renderTabs();renderContent()});
  const fab=document.getElementById("fabAdd");
  if(fab&&!fab.dataset.wired){
    fab.dataset.wired="1";
    fab.onclick=()=>{if(!navigator.onLine){alert("Offline — connect to add a transaction.");return}openQuickEntrySheet()};
  }
  const contentEl=document.getElementById("content");
  if(contentEl&&!contentEl.dataset.ptr){
    contentEl.dataset.ptr="1";
    pullToRefresh(contentEl,()=>{
      document.getElementById("refreshBtn")?.click();
    },()=>state.tab==="income"||state.tab==="ledger");
  }
}

// AUTH
// ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●

function showLogin() {
  hideMonthlyChecklist();
  document.getElementById('loginScreen').classList.remove('hidden');
  document.querySelector('.hdr').classList.add('hidden');
  document.getElementById('content').classList.add('hidden');
  document.querySelector('.foot').classList.add('hidden');
}

function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.querySelector('.hdr').classList.remove('hidden');
  document.getElementById('content').classList.remove('hidden');
  document.querySelector('.foot').classList.remove('hidden');
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPass').value
    });
    if (error) throw error;
    currentSession = data.session;
    await loadProfile();
    showApp();
    init();
  } catch (err) {
    errEl.textContent = err.message || 'Invalid login credentials';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});

async function checkAuthAndInit() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentSession = session;

  if (session) {
    await loadProfile();
    showApp();
    init();
  } else {
    showLogin();
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    currentSession = session;
    if (event === 'SIGNED_OUT') {
      showLogin();
    }
  });
}

// Register Service Worker (FEA-23)
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(reg=>console.log('SW registered, scope:',reg.scope)).catch(err=>console.warn('SW registration failed:',err));
  navigator.serviceWorker.addEventListener('message',event=>{
    if(event.data?.type==='SW_UPDATE_AVAILABLE'){
      if(document.getElementById('updateBanner'))return;
      const banner=document.createElement('div');banner.id='updateBanner';
      banner.style.cssText='background:rgba(129,178,154,0.15);color:var(--g);text-align:center;padding:8px 12px;font-size:12px;border-bottom:1px solid rgba(129,178,154,0.2);cursor:pointer;font-weight:600';
      banner.innerHTML='New version available \u2014 <u>Refresh</u>';banner.onclick=()=>location.reload();
      const hdr=document.querySelector('.hdr');if(hdr)hdr.before(banner);
    }
  });
}
